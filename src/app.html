<title>Koch-Quartier Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a Swiss competition model of Albisrieden/Altstetten fills the screen (plaster city on a model board,
   the Koch-Areal set in as birch wood). A left rail holds the masthead and a tabbed guide; a place card opens on
   the right; on phones the guide becomes a bottom sheet. Pins and the UI share one category palette. */
:root{
  --table:#DCD8CF; --table-2:#ECE9E2; --paper:#FBFAF7; --paper-2:#F1EFE9; --ink:#1B1F1D; --muted:#5C6460; --line:#DDD9D0;
  --birch:#B07C3F; --birch-soft:#F3E7D4; --accent:#2747A8; --accent-soft:#E3E9F9; --on-accent:#FFFFFF;
  --c-kita:#D2456E; --c-school:#7E55C4; --c-play:#DB8E12; --c-green:#3C9257; --c-sport:#1F86C2; --c-culture:#C9452F;
  --c-food:#A26E1C; --c-community:#13948B; --c-health:#A9479A; --c-mobility:#4D5866; --c-recycle:#5F8127; --c-water:#2D8FD1;
  --shadow:0 12px 32px rgba(40,34,24,.14),0 1px 2px rgba(40,34,24,.10);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px; --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --table:#0C0F0E; --table-2:#161B19; --paper:#171C1A; --paper-2:#1F2523; --ink:#E7ECE8; --muted:#9AA59F; --line:#2B3330;
  --birch:#DEA866; --birch-soft:#392B19; --accent:#9DB2F6; --accent-soft:#1D2849; --on-accent:#0B1430;
  --c-kita:#F06E93; --c-school:#A98AE6; --c-play:#F2B54A; --c-green:#62B97C; --c-sport:#4FB0E8; --c-culture:#EE6B54;
  --c-food:#D59E45; --c-community:#3CC2B8; --c-health:#D774C3; --c-mobility:#A6B2C2; --c-recycle:#93B655; --c-water:#62B6EE;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --table:#0C0F0E; --table-2:#161B19; --paper:#171C1A; --paper-2:#1F2523; --ink:#E7ECE8; --muted:#9AA59F; --line:#2B3330;
  --birch:#DEA866; --birch-soft:#392B19; --accent:#9DB2F6; --accent-soft:#1D2849; --on-accent:#0B1430;
  --c-kita:#F06E93; --c-school:#A98AE6; --c-play:#F2B54A; --c-green:#62B97C; --c-sport:#4FB0E8; --c-culture:#EE6B54;
  --c-food:#D59E45; --c-community:#3CC2B8; --c-health:#D774C3; --c-mobility:#A6B2C2; --c-recycle:#93B655; --c-water:#62B6EE;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#app{position:relative;height:100%;padding-left:var(--gl);padding-right:var(--gr);padding-block:0;--scene:#DCD8CF;--scene-2:#ECE9E2;
  background:radial-gradient(120% 90% at 55% 45%,var(--scene-2) 0%,var(--scene) 70%)}
#app[data-night]{--scene:#0C0F0E;--scene-2:#161B19}
/* The interface is dark; the model and its labels stay in daylight unless the visitor switches the city to night. */
#app:not([data-night]) #labels{--paper:#FBFAF7;--paper-2:#F1EFE9;--ink:#1B1F1D;--muted:#5C6460;--line:#DDD9D0;--birch:#B07C3F;--birch-soft:#F3E7D4;--accent:#2747A8;--on-accent:#FFFFFF}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#gl.pick{cursor:crosshair}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ov{position:absolute;z-index:3}

/* ---------- 3D labels ---------- */
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;will-change:transform}
.lb.poi{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 6px;border-radius:999px;background:var(--paper);
  border:1px solid var(--line);font:600 11.5px/1.2 var(--f-ui);color:var(--ink);box-shadow:0 2px 8px rgba(30,26,20,.14);pointer-events:auto;cursor:pointer;margin-top:-6px}
.lb.poi i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.lb.poi.sel{z-index:2;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lb.poi small{font:500 10px var(--f-num);color:var(--muted)}
.lb.poi.sel small{color:inherit;opacity:.75}
.lb.koch{z-index:3;padding:4px 10px;border-radius:8px;background:var(--birch);color:var(--paper);font:700 12px/1.15 var(--f-display);letter-spacing:.01em;pointer-events:auto;cursor:pointer;box-shadow:0 3px 10px rgba(80,50,10,.25);margin-top:-8px}
.lb.koch small{display:block;font:500 10px var(--f-num);opacity:.85}
.lb.kochs{padding:2px 7px;border-radius:6px;background:var(--birch-soft);color:var(--birch);border:1px solid color-mix(in srgb,var(--birch) 35%,transparent);font:600 10.5px var(--f-ui);pointer-events:auto;cursor:pointer}
.lb.station{padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--paper);font:600 11px var(--f-ui)}
.lb.place{font:italic 500 11px/1.2 var(--f-display);color:var(--muted);text-shadow:0 0 3px var(--paper),0 0 6px var(--paper);transform:translate(-50%,-50%)}
.lb.ring{font:600 10px var(--f-num);color:var(--muted);background:var(--paper);padding:1px 6px;border-radius:5px;border:1px solid var(--line);transform:translate(-50%,-50%)}
.lb.stop{font:600 10px var(--f-ui);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.lb.num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 11px var(--f-num);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lb.band{display:flex;align-items:center;gap:6px;font:600 10.5px var(--f-ui);padding:2px 8px 2px 5px;border-radius:5px;background:var(--paper);color:var(--ink);border:1px solid var(--line);transform:translate(0,-50%)}
.lb.band i{width:9px;height:9px;border-radius:2px}
.lb.poi.hl{border-color:var(--birch);box-shadow:0 0 0 2px color-mix(in srgb,var(--birch) 30%,transparent),0 2px 8px rgba(30,26,20,.14)}
.lb.poi.hl small{color:var(--birch)}
.lb.evt{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--birch);color:var(--paper);font:600 11.5px/1.2 var(--f-ui);box-shadow:0 3px 10px rgba(80,50,10,.25);pointer-events:auto;cursor:pointer;margin-top:-6px}
.lb.evt b{font:700 10px var(--f-num);background:var(--paper);color:var(--birch);border-radius:999px;padding:2px 6px}

/* ---------- left rail ---------- */
.rail{position:absolute;z-index:4;top:calc(14px + env(safe-area-inset-top,0px));left:var(--gl);bottom:14px;width:384px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.rail>*{pointer-events:auto}
/* the flight around the tower starts only when asked */
.flybtn{flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font:600 12.5px var(--f-ui);box-shadow:var(--shadow);cursor:pointer}
.flybtn i{width:24px;height:24px;border-radius:50%;background:var(--birch);color:var(--paper);display:grid;place-items:center;flex:0 0 auto}
.flybtn i svg{width:13px;height:13px}
.flybtn small{font:500 10.5px var(--f-num);color:var(--muted)}
.flybtn:hover{border-color:var(--birch)}
#app[data-intro] .flybtn{display:none}
.mast{padding:16px 18px 14px;display:grid;gap:6px;flex:0 0 auto}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mast h1{margin:2px 0 0;font:800 40px/0.95 var(--f-display);font-variation-settings:"opsz" 96;letter-spacing:-.03em;text-wrap:balance}
.mast h1 b{color:var(--birch);font-weight:800}
.lead{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45;max-width:46ch}
.stats{margin:4px 0 0;font:500 11px var(--f-num);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.stats b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--paper-2)}
.seg button{border:0;background:transparent;padding:3px 9px;border-radius:7px;font:600 11.5px var(--f-num);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.guide{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:0;padding:6px 6px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs button{border:0;background:transparent;padding:9px 4px 10px;font:600 12.5px var(--f-ui);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:4px;align-items:baseline;flex:1 0 auto;justify-content:center}
.tabs button small{font:500 10px var(--f-num);color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sheet-handle{display:none}
.panel{overflow:auto;min-height:0;flex:1 1 auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.panel>*{flex-shrink:0}
.panel h3{margin:0;font:700 16px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.panel p{margin:0}
.sh{font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--paper-2)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:13.5px}
.search svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px 4px 8px;font:600 12px var(--f-ui);cursor:pointer;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%}
.chip small{font:500 10.5px var(--f-num);color:var(--muted)}
.chip[aria-pressed="false"]{color:var(--muted);background:transparent;border-style:dashed}
.chip[aria-pressed="false"] i{opacity:.35}
.chip.solid[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.solid[aria-pressed="true"] small{color:inherit;opacity:.7}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:600 12px var(--f-ui);cursor:pointer}

.list{display:grid;margin:0 -6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:8px}
.row:hover{background:var(--paper-2)}
.row:last-child{border-bottom:0}
.row i.dot{width:10px;height:10px;border-radius:50%}
.row b{display:block;font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.row span.sub{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font:600 11.5px var(--f-num);font-style:normal;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.sel{background:var(--accent-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font:600 12.5px var(--f-ui);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.birch{background:var(--birch);border-color:var(--birch);color:var(--paper)}
.btn svg{width:15px;height:15px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* walks */
.tour{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--paper)}
.tour .top{display:flex;gap:10px;align-items:flex-start}
.tour .ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.tour .ico svg{width:18px;height:18px}
.tour .meta{font:500 11px var(--f-num);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.tour ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.tour ol li::marker{font:600 11px var(--f-num);color:var(--accent)}

/* agenda */
.months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;margin:0 -2px}
.months button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 8px 4px;cursor:pointer;display:grid;justify-items:center;line-height:1.1;min-width:46px}
.months button b{font:600 12px var(--f-ui)}
.months button small{font:500 9.5px var(--f-num);color:var(--muted)}
.months button span{font:600 9.5px var(--f-num);color:var(--accent);height:11px}
.months button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.months button[aria-pressed="true"] small,.months button[aria-pressed="true"] span{color:inherit;opacity:.8}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:8px;width:100%}
.ev:hover{background:var(--paper-2)}
.ev .date{border:1px solid var(--line);border-radius:9px;text-align:center;padding:4px 0 3px;background:var(--paper);line-height:1.05}
.ev .date b{display:block;font:700 17px var(--f-display)}
.ev .date small{font:600 9.5px var(--f-num);text-transform:uppercase;color:var(--muted)}
.ev .date.rec b{font-size:12px;font-family:var(--f-num);padding:3px 0}
.ev h4{margin:0;font-size:13px;font-weight:600;line-height:1.3}
.ev p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;font:600 9.5px var(--f-ui);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--birch-soft);color:var(--birch);margin-left:6px;vertical-align:1px}
.tag.next{background:var(--accent-soft);color:var(--accent)}

/* highlights (top of the explore tab) */
.hls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hl{display:grid;gap:4px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 10px 9px;cursor:pointer;color:var(--ink);min-width:0}
.hl:hover{border-color:var(--ink)}
.hl .k{display:flex;align-items:center;gap:5px;font:600 9.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--birch)}
.hl .k svg{width:13px;height:13px;flex:0 0 auto}
.hl b{font:700 13px/1.25 var(--f-display);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hl small{font:500 10.5px var(--f-num);color:var(--muted)}

/* involve */
.idea{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.idea .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--birch-soft);color:var(--birch)}
.idea .ico svg{width:17px;height:17px}
.idea h4{margin:0 0 3px;font-size:13.5px;font-weight:700;line-height:1.3}
.idea p{font-size:12.5px;color:var(--muted)}
.idea .linkbtn{margin-top:6px}
.suggest{border:1px dashed var(--birch);border-radius:14px;padding:14px;display:grid;gap:10px;background:color-mix(in srgb,var(--birch-soft) 55%,transparent)}
.field{display:grid;gap:4px}
.field label{font:600 11px var(--f-ui);color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--paper);font-size:13px;width:100%}
pre.snip{margin:0;padding:10px;border-radius:10px;background:var(--paper-2);border:1px solid var(--line);font:500 11px/1.5 var(--f-num);white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}

/* about */
.prose{display:grid;gap:10px;font-size:13px;line-height:1.55}
.prose p{max-width:62ch}
.kv{display:grid;margin:0}
.kv div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* ---------- place card ---------- */
.placecard{top:calc(14px + env(safe-area-inset-top,0px));right:calc(var(--gr) + 54px);width:364px;max-height:calc(100% - 96px);overflow:auto;padding:18px 18px 16px;display:grid;gap:12px;align-content:start;z-index:5}
.placecard .close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.placecard .close:hover{background:var(--paper-2);color:var(--ink)}
.placecard .close svg{width:16px;height:16px}
.kick{display:flex;align-items:center;gap:7px;font:600 10.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-right:30px}
.kick i{width:10px;height:10px;border-radius:50%}
.placecard h2{margin:0;font:750 23px/1.12 var(--f-display);letter-spacing:-.02em;text-wrap:balance;padding-right:16px}
.walk{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);font:600 11.5px var(--f-num);font-variant-numeric:tabular-nums}
.pill svg{width:13px;height:13px}
.pill.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.desc{font-size:13.5px;line-height:1.55}
.addr{font-size:12px;color:var(--muted)}
.lagen{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch}
.tower{width:44px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 3px 3px;overflow:hidden;border:1px solid var(--line)}
.tower div{flex:0 0 auto}
.lagen table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.lagen th{font:600 10.5px var(--f-ui);color:var(--muted);text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
.lagen td{padding:5px 4px;border-bottom:1px solid var(--line)}
.lagen td.n{text-align:right;font-family:var(--f-num)}
.lagen tr:last-child td{border-bottom:0}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ---------- tools ---------- */
.tools{top:calc(14px + env(safe-area-inset-top,0px));right:var(--gr);display:grid;gap:2px;padding:4px}
.tools button{width:36px;height:36px;border:0;background:transparent;border-radius:9px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.tools button:hover{background:var(--paper-2)}

<script>
// If the 3D module cannot load (WebGL off, CDN blocked), say so instead of leaving a blank board.
window.__kqErr = [];
addEventListener('error', e => window.__kqErr.push(e.message || 'load error'), true);
addEventListener('unhandledrejection', e => window.__kqErr.push(String(e.reason)));
setTimeout(() => {
  if (window.__kqReady) return;
  const el = document.getElementById('loading');
  if (!el) return;
  el.innerHTML = '<span><b>Das 3D-Modell ist nicht gestartet.</b><br>Seite neu laden. Bleibt sie leer, blockiert der Browser WebGL oder den Download von three.js (cdn.jsdelivr.net).<br><small style="color:var(--muted)"></small></span>';
  el.querySelector('small').textContent = window.__kqErr.slice(0, 3).join(' · ');
}, 15000);
</script>

function dec(a, i, n) {

}

// flat polygon (with holes) at height y, facing up
function addFlat(acc, outer, holes, y, extra = {}) {
  let faces;
  try { faces = THREE.ShapeUtils.triangulateShape(outer.map(p => new THREE.Vector2(p[0], p[1])), holes.map(h => h.map(p => new THREE.Vector2(p[0], p[1])))); }
  catch { return; }
  const all = outer.concat(...holes);
  for (const f of faces) {
    let [a, b, c] = f.map(i => all[i]);
    if (!a || !b || !c) continue;
    if ((b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]) < 0) [b, c] = [c, b];
    for (const q of [a, b, c]) acc.v(q[0], y, -q[1], 0, 1, 0, extra.col ?? 1, extra.uvw ?? [0, -100, 0], extra.del ?? 0, extra.cat ?? 0, extra.uvScale ? [q[0] / extra.uvScale, q[1] / extra.uvScale] : [0, 0]);
  }
}

// extruded prism walls + roof
function addPrism(acc, outer, holes, h, mh, o = {}) {
  const win = o.windows !== false;
  for (const ring of [outer, ...holes]) {
    let u = 0;
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
      if (len < 0.05) continue;
      const nx = dy / len, ny = -dx / len;            // outward (xy)
      const N = [nx, 0, -ny];
      const cb = mh < 0.5 ? (o.col ?? 1) * 0.8 : (o.col ?? 1), ct = o.col ?? 1;
      const vb = win ? mh : -100, vt = win ? h : -100;
      const sc = o.uvScale || 0;
      const A0 = [a[0], mh, -a[1], cb, [u, vb, o.seed ?? 0], [u / (sc || 1), mh / (sc || 1)]];
      const B0 = [b[0], mh, -b[1], cb, [u + len, vb, o.seed ?? 0], [(u + len) / (sc || 1), mh / (sc || 1)]];
      const B1 = [b[0], h, -b[1], ct, [u + len, vt, o.seed ?? 0], [(u + len) / (sc || 1), h / (sc || 1)]];
      const A1 = [a[0], h, -a[1], ct, [u, vt, o.seed ?? 0], [u / (sc || 1), h / (sc || 1)]];
      for (const V of [A0, B0, B1, A0, B1, A1]) acc.v(V[0], V[1], V[2], N[0], N[1], N[2], V[3], V[4], o.del ?? 0, o.cat ?? 0, V[5]);
      u += len;
    }
  }
  addFlat(acc, outer, holes, h, { col: (o.col ?? 1) * 1.03, uvw: [0, -100, o.seed ?? 0], del: o.del ?? 0, cat: o.cat ?? 0, uvScale: o.uvScale });
}

// ribbons for streets, rails, routes
function addRibbon(acc, pts, w, y) {
  if (pts.length < 2) return;
  const half = w / 2, L = [], Rr = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    let nx = -dy, ny = dx, m = 1;
    if (i > 0 && i < pts.length - 1) {
      const d1x = p[0] - a[0], d1y = p[1] - a[1], l1 = Math.hypot(d1x, d1y) || 1;
      const n1x = -d1y / l1, n1y = d1x / l1;
      const dot = nx * n1x + ny * n1y; m = Math.min(2.2, 1 / Math.max(0.45, dot));
    }
    L.push([p[0] + nx * half * m, p[1] + ny * half * m]); Rr.push([p[0] - nx * half * m, p[1] - ny * half * m]);
  }
  for (let i = 0; i < pts.length - 1; i++) {
    const q = [Rr[i], Rr[i + 1], L[i + 1], Rr[i], L[i + 1], L[i]];
    for (const v of q) acc.v(v[0], y, -v[1], 0, 1, 0, 1, [0, -100, 0], 0, 0, [0, 0]);
  }
}
